services:
  api:
    build: ./api
    ports:
      - "5556:5556"
    volumes:
      - api-data:/app/data
      - api-uploads:/app/uploads
    environment:
      - ASPNETCORE_URLS=http://+:5556
      - ConnectionStrings__Default=Data Source=/app/data/lifecycle.db
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "5557:5557"
    depends_on:
      - api
    environment:
      - API_URL=http://api:5556
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
    restart: unless-stopped

volumes:
  api-data:
  api-uploads:
