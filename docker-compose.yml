services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
    depends_on:
      - api
      - web
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    restart: unless-stopped

  api:
    build: ./api
    volumes:
      - api-data:/app/data
      - api-uploads:/app/uploads
    environment:
      - ConnectionStrings__Default=Data Source=/app/data/lifecycle.db
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    restart: unless-stopped

  web:
    build: ./web
    environment:
      - API_URL=http://api:5556
      - ORIGIN=https://cloud-server.chimp-map.ts.net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped

volumes:
  api-data:
  api-uploads:
  caddy-data:
